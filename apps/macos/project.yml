name: Glance
options:
  bundleIdPrefix: app.glance
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.glance.mac
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Glance:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Glance
        CFBundleDisplayName: Glance
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Copyright © 2026 Glance. All rights reserved."
        NSAppleEventsUsageDescription: "Glance needs Accessibility access to capture selected text from other apps."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Glance.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Glance.entitlements
